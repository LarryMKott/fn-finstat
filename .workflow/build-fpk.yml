# ============================================================
# fn-finstat Gitee Go 流水线 — 云端打包 FPK + 发布 Gitee Release
#
# 模型: 流水线 → 多个阶段（串行）→ 每个阶段多个任务 → 一个任务对应一个插件
# 触发: push 到 main 分支；也支持在 Gitee Go 界面手动运行
#
# build stage: 单 step 调 ci_build.sh，脚本内串行执行
#   1. 环境准备 — apt 换清华源 + python3/pip 安装
#   2. 测试门禁 — 安装测试依赖 + 单元测试 + ruff 静态检查
#   3. 构建打包 — Node 自举 + 前端构建 + fnpack 打包 + 产物重命名
#   4. 发布日志 — gen_release_notes.py 整理提交历史，输出 releaseNode.txt
#
# 发布策略:
#   - tag 用应用版本号（v0.7.0），取自 VERSION 文件：build 阶段写入
#     GITEE_PARAMS，release 阶段以 ${APP_VERSION} 引用（VERSION 仍是唯一来源）
#   - 代价：同版本重复构建会覆盖同名 Release（allowUpdate: true），
#     历史靠 CHANGELOG.md 保留，而非靠 tag 堆积
#   - ci_build.sh 同时输出：
#       fn-finstat.fpk              — 固定名，release@gitee 上传用
#       fn-finstat-v{版本号}.fpk     — 带应用版本号
#       releaseNode.txt             — 自动整理的 Release 日志
#
# Release 日志机制:
#   - release@gitee 的 description 支持 "兜底文本 | 文件路径" 语法，
#     会读取仓库工作目录下的 releaseNode.txt 作为 Release 描述正文
#   - 日志按约定式提交自动分组（新功能/修复/安全/重构/CI...），
#     基线取自 CHANGELOG.md 中的 release-baseline 标记，
#     即"上次发版至今"的增量，而非全量历史
#   - 本地可手动生成: python3 scripts/gen_release_notes.py --update-changelog
# ============================================================
version: '1.0'
name: build-fpk
displayName: 构建发布FPK

triggers:
  push:
    branches:
      include:
        - main

stages:
  # ---------- 构建阶段 ----------
  - name: build
    displayName: 构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_all
        displayName: 构建打包
        nodeVersion: 24.18.0
        commands: |
          bash scripts/ci_build.sh
          if [ ! -f "./fn-finstat.fpk" ]; then
            echo "❌ 构建失败：未找到产物 fn-finstat.fpk"
            exit 1
          fi
          APP_VERSION="$(cat VERSION | tr -d '\r' | tr -d ' \n')"
          FPK_VERSIONED="fn-finstat-v${APP_VERSION}.fpk"
          if [ ! -f "./${FPK_VERSIONED}" ]; then
            echo "❌ 构建失败：未找到带版本号产物 ${FPK_VERSIONED}"
            exit 1
          fi
          echo "✅ 构建产物确认："
          ls -lh ./fn-finstat.fpk ./${FPK_VERSIONED}
          if [ ! -s "./releaseNode.txt" ]; then
            echo "❌ 构建失败：未生成 Release 日志 releaseNode.txt"
            exit 1
          fi
          echo "✅ Release 日志确认：$(wc -l < ./releaseNode.txt) 行"

          # 把应用版本号传给 release 阶段作为 tag/releaseName 的来源。
          # 用 Gitee Go 原生的 GITEE_PARAMS 文件（跨阶段传参机制，
          # 见 https://help.gitee.com/gitee-go/pipeline/parameter）。
          # 不要用 ##vso[task.setvariable]——那是 Azure DevOps 的语法，
          # Gitee Go 不识别（历史提交 f12443a 曾因此失败，见 395cd64）。
          # 注意用 if 而非 `[ -z ] && ...`：后者在条件不成立时返回非零，
          # 部分 runner 会因此判定该行失败
          if [ -z "$APP_VERSION" ]; then APP_VERSION="0.0.0-unknown"; fi
          echo "==> 应用版本：${APP_VERSION}"
          echo "APP_VERSION=${APP_VERSION}" >> GITEE_PARAMS
        artifacts:
          - name: FPK_ARTIFACT
            path:
              - ./fn-finstat.fpk
              - ./fn-finstat-v*.fpk
              - ./releaseNode.txt

  # ---------- 发布阶段 ----------
  - name: release
    displayName: 发布
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: 发布到Gitee Release
        releaseName: fn-finstat v${APP_VERSION}
        tagName: v${APP_VERSION}
        # "兜底文本 | 文件路径"：插件优先读取 releaseNode.txt 内容作为描述，
        # 文件缺失时才回落到竖线前的文本
        description: "fn-finstat v${APP_VERSION}（流水线构建号 ${GITEE_PIPELINE_BUILD_NUMBER}）| releaseNode.txt"
        upstreamArtifact:
          - FPK_ARTIFACT
        assertFiles:
          - fn-finstat.fpk
          - fn-finstat-v*.fpk
          - releaseNode.txt
        prerelease: false
        allowUpdate: true
