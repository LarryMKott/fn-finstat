# ============================================================
# fn-finstat Gitee Go 流水线 — 正式版打包 FPK + 发布 Gitee Release
#
# 模型: 流水线 → 多个阶段（串行）→ 每个阶段多个任务 → 一个任务对应一个插件
# 触发: push 到 main 分支；也支持在 Gitee Go 界面手动运行
#
# 姊妹流水线: build-fpk-dev.yml（dev 分支 → 测试版产物，prerelease: true）
#   两者共用 scripts/ci_build.sh，差别只在 BUILD_CHANNEL：
#   release（本文件）版本号 = VERSION 原值；dev 版本号带 -dev 后缀。
#
# build stage: 单 step 调 ci_build.sh，脚本内串行执行
#   1. 环境准备 — apt 换清华源 + python3/pip 安装
#   2. 渠道判定 — 定产物版本号（本流水线固定 BUILD_CHANNEL=release）
#   3. 测试门禁 — 安装测试依赖 + 单元测试 + ruff 静态检查
#   4. 构建打包 — Node 自举 + 前端构建 + fnpack 打包 + 产物重命名
#   5. 发布日志 — gen_release_notes.py 整理提交历史，输出 releaseNode.txt
#
# 发布策略:
#   - tag 用应用版本号（v0.7.0）：build 阶段写入 GITEE_PARAMS，
#     release 阶段以 ${APP_VERSION} 引用（版本号由 ci_build.sh 派生，单一来源）
#   - 代价：同版本重复构建会覆盖同名 Release（allowUpdate: true），
#     历史靠 CHANGELOG.md 保留，而非靠 tag 堆积
#   - ci_build.sh 同时输出：
#       fn-finstat.fpk              — fnpack 原始输出，仅作流水线制品与构建证明
#       fn-finstat-latest.fpk       — 渠道别名（正式版固定 latest），Release 附件主入口
#       fn-finstat-v{版本号}.fpk     — 带应用版本号副本，用于区分具体构建
#       MD5SUMS.txt                 — 上述两个交付产物的 MD5 校验文件（md5sum -c 可校验）
#       releaseNode.txt             — 自动整理的 Release 日志
#
# Release 日志机制:
#   - release@gitee 的 description 支持 "兜底文本 | 文件路径" 语法，
#     会读取仓库工作目录下的 releaseNode.txt 作为 Release 描述正文
#   - 日志按约定式提交自动分组（新功能/修复/安全/重构/CI...），
#     基线取自 CHANGELOG.md 中的 release-baseline 标记，
#     即"上次发版至今"的增量，而非全量历史
#   - 本地可手动生成: python3 scripts/gen_release_notes.py --update-changelog
# ============================================================
version: '1.0'
name: build-fpk
displayName: 构建发布FPK

triggers:
  push:
    branches:
      include:
        - main

stages:
  # ---------- 构建阶段 ----------
  - name: build
    displayName: 构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_all
        displayName: 构建打包
        nodeVersion: 24.18.0
        commands: |
          # 显式指定渠道：本流水线只出正式版，不依赖分支名推断
          BUILD_CHANNEL=release bash scripts/ci_build.sh
          if [ ! -f "./fn-finstat.fpk" ]; then
            echo "❌ 构建失败：未找到产物 fn-finstat.fpk"
            exit 1
          fi
          # 产物版本号由 ci_build.sh 派生后落盘（sync_version.py 是唯一算法来源），
          # yml 不再自己 cat VERSION——否则 dev 渠道下两处算法会各算一套而漂移
          BUILD_VERSION="$(tr -d '\r\n' < .local_tmp/build-version.txt)"
          # 正式版渠道别名固定为 latest：产物文件名的稳定下载入口
          FPK_ALIAS="fn-finstat-latest.fpk"
          FPK_VERSIONED="fn-finstat-v${BUILD_VERSION}.fpk"
          # 渠道串线要在这里爆出来：正式版流水线不得产出带 -dev 的版本号
          case "$BUILD_VERSION" in
            *-dev*)
              echo "❌ 渠道校验失败：正式版流水线产出了测试版版本号（${BUILD_VERSION}）"
              exit 1
              ;;
          esac
          for f in "$FPK_ALIAS" "$FPK_VERSIONED"; do
            if [ ! -f "./$f" ]; then
              echo "❌ 构建失败：未找到产物 $f"
              exit 1
            fi
          done
          echo "✅ 构建产物确认："
          ls -lh ./fn-finstat.fpk ./${FPK_ALIAS} ./${FPK_VERSIONED}
          if [ ! -s "./releaseNode.txt" ]; then
            echo "❌ 构建失败：未生成 Release 日志 releaseNode.txt"
            exit 1
          fi
          echo "✅ Release 日志确认：$(wc -l < ./releaseNode.txt) 行"
          if [ ! -s "./MD5SUMS.txt" ]; then
            echo "❌ 构建失败：未生成 MD5 校验文件 MD5SUMS.txt"
            exit 1
          fi
          echo "✅ MD5 校验文件（$(wc -l < ./MD5SUMS.txt) 个产物）："
          cat ./MD5SUMS.txt

          # 把应用版本号传给 release 阶段作为 tag/releaseName 的来源。
          # 用 Gitee Go 原生的 GITEE_PARAMS 文件（跨阶段传参机制，
          # 见 https://help.gitee.com/gitee-go/pipeline/parameter）。
          # 不要用 ##vso[task.setvariable]——那是 Azure DevOps 的语法，
          # Gitee Go 不识别（历史提交 f12443a 曾因此失败，见 395cd64）。
          # 注意用 if 而非 `[ -z ] && ...`：后者在条件不成立时返回非零，
          # 部分 runner 会因此判定该行失败
          if [ -z "$BUILD_VERSION" ]; then BUILD_VERSION="0.0.0-unknown"; fi
          echo "==> 应用版本：${BUILD_VERSION}"
          echo "APP_VERSION=${BUILD_VERSION}" >> GITEE_PARAMS
        artifacts:
          - name: FPK_ARTIFACT
            path:
              - ./fn-finstat.fpk
              - ./fn-finstat-latest.fpk
              - ./fn-finstat-v*.fpk
              - ./MD5SUMS.txt
              - ./releaseNode.txt

  # ---------- 发布阶段 ----------
  - name: release
    displayName: 发布
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: 发布到Gitee Release
        releaseName: fn-finstat v${APP_VERSION}
        tagName: v${APP_VERSION}
        # Release 描述直接传已入库的 RELEASE_NOTES.md（官方博客的文档化用法）。
        # 它只含**本次版本**那一节，页面才等于「本次改了什么」。不要改回 CHANGELOG.md：
        # 那是累积文件，贴上去后页面里混着若干历史版本的日志，读者第一眼看到的
        # 可能是几个版本前的内容（dev 渠道每次 push 都发 Release，撞得最明显）。
        # 不要用 "文本 | releaseNode.txt" 组合语法：企业版文档写明文件是
        # 「从流水线运行时的 commit 仓库代码中」读取，而 releaseNode.txt 是
        # 构建期生成、被 .gitignore 排除的文件，永远不在仓库里——构建 #42/#44
        # 两次验证该语法均不生效，整串被当作字面描述展示。
        # 本次构建的分组日志与 SHA-256 校验和仍由附件 releaseNode.txt 承载
        # （ci_build.sh 生成，构建阶段已断言非空）。
        # ⚠️ 该文件由 `gen_release_notes.py --update-changelog` 与 CHANGELOG 同批生成，
        # 且必须**先提交它、再推送**（描述取自提交里的文件内容）。要改日志请改生成器，
        # 不要手改这个文件。
        description: RELEASE_NOTES.md
        upstreamArtifact:
          - FPK_ARTIFACT
        assertFiles:
          # 裸名 fn-finstat.fpk 只作为流水线制品与构建证明，不上传附件——
          # 它与 latest 别名内容完全相同，一起挂在 Release 上只会让人犹豫该下哪个
          - fn-finstat-latest.fpk
          - fn-finstat-v*.fpk
          - MD5SUMS.txt
          - releaseNode.txt
        prerelease: false
        allowUpdate: true
