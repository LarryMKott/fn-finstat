# ============================================================
# fn-finstat Gitee Go 流水线 — 云端打包 FPK + 发布 Gitee Release
#
# 模型: 流水线 → 多个阶段（串行）→ 每个阶段多个任务 → 一个任务对应一个插件
# 触发: push 到 main 分支；也支持在 Gitee Go 界面手动运行
#
# build stage 拆为 3 个 step（串行，前一个失败则后一个不执行）:
#   step 1: 环境准备 — apt 换清华源 + python3/pip 安装
#   step 2: 测试门禁 — 单元测试 + ruff 静态检查
#   step 3: 构建打包 — Node 自举 + 前端构建 + fnpack 打包 + 产物重命名
#
# 发布策略:
#   - release@gitee 只识别内置变量（${GITEE_PIPELINE_BUILD_NUMBER}），
#     tag 用构建号（每次构建唯一），用户从附件文件名识别应用版本
#   - ci_build.sh 同时输出：
#       fn-finstat.fpk              — 固定名，release@gitee 上传用
#       fn-finstat-v{版本号}.fpk     — 带应用版本号
# ============================================================
version: '1.0'
name: build-fpk
displayName: 构建发布FPK

triggers:
  push:
    branches:
      include:
        - main

stages:
  # ---------- 构建阶段（3 个 step 串行） ----------
  - name: build
    displayName: 构建
    strategy: naturally
    trigger: auto
    steps:
      # Step 1: 环境准备
      - step: build@nodejs
        name: env_setup
        displayName: 环境准备
        nodeVersion: 20.19.0
        commands: |
          bash scripts/ci_env.sh

      # Step 2: 测试门禁
      - step: build@nodejs
        name: test_gate
        displayName: 测试门禁
        nodeVersion: 20.19.0
        commands: |
          bash scripts/ci_test.sh

      # Step 3: 构建打包
      - step: build@nodejs
        name: build_package
        displayName: 构建打包
        nodeVersion: 20.19.0
        commands: |
          bash scripts/ci_package.sh
          if [ ! -f "./fn-finstat.fpk" ]; then
            echo "❌ 构建失败：未找到产物 fn-finstat.fpk"
            exit 1
          fi
          APP_VERSION="$(cat VERSION | tr -d '\r' | tr -d ' \n')"
          FPK_VERSIONED="fn-finstat-v${APP_VERSION}.fpk"
          if [ ! -f "./${FPK_VERSIONED}" ]; then
            echo "❌ 构建失败：未找到带版本号产物 ${FPK_VERSIONED}"
            exit 1
          fi
          echo "✅ 构建产物确认："
          ls -lh ./fn-finstat.fpk ./${FPK_VERSIONED}
        artifacts:
          - name: FPK_ARTIFACT
            path:
              - ./fn-finstat.fpk
              - ./fn-finstat-v*.fpk

  # ---------- 发布阶段 ----------
  - name: release
    displayName: 发布
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: 发布到Gitee Release
        releaseName: fn-finstat v${GITEE_PIPELINE_BUILD_NUMBER}
        tagName: v${GITEE_PIPELINE_BUILD_NUMBER}
        description: "fn-finstat 自动构建版本（构建号 ${GITEE_PIPELINE_BUILD_NUMBER}）。\n\n注意：应用真实版本号见附件文件名（fn-finstat-v{版本号}.fpk）。"
        upstreamArtifact:
          - FPK_ARTIFACT
        assertFiles:
          - fn-finstat.fpk
          - fn-finstat-v*.fpk
        prerelease: false
        allowUpdate: true
