# Gitee Go 流水线：自动编译并发布 fn-finstat.fpk
# 触发条件：push 到 main、推送 v 开头的 Tag；也支持在 Gitee Go 界面手动运行
# 执行顺序：构建打包 FPK -> 上传制品库 -> 发布版本（阶段间经暂存制品 FPK_ARTIFACT 传递）
version: '1.0'
name: build-fpk
displayName: 构建发布 FPK

triggers:
  push:
    branches:
      include:
        - main
    tags:
      include:
        - v*  # Gitee Go 通配符写法，匹配所有 v 开头的 Tag；如需严格正则可用 ^v\d+\.\d+\.\d+$

stages:
  - stage:
      name: build
      displayName: 1-构建打包FPK
      steps:
        - step: build@nodejs
          name: build_fpk
          displayName: 编译前端并打包 FPK
          nodeVersion: 14.16.0
          commands: |
            bash scripts/ci_build.sh
            # 新增：构建产物存在性校验，避免空制品导致下游失败
            if [ ! -f "./fn-finstat.fpk" ]; then
              echo "❌ 构建失败：未找到产物 fn-finstat.fpk"
              exit 1
            fi
            echo "✅ 构建产物确认："
            ls -lh ./fn-finstat.fpk
          artifacts:
            # 暂存构建产物，供下游上传阶段通过 dependArtifact 引用
            - name: FPK_ARTIFACT
              path:
                - ./fn-finstat.fpk

  - stage:
      name: upload
      displayName: 2-上传制品库
      steps:
        - step: publish@general_artifacts
          name: publish_artifact
          displayName: 上传 FPK 到通用制品库
          dependArtifact: FPK_ARTIFACT
          artifactRepository: default
          artifactName: fn-finstat

  - stage:
      name: release
      displayName: 3-发布版本
      steps:
        - step: publish@release_artifacts
          name: publish_release
          displayName: 发布 FPK 到版本制品库
          dependArtifact: fn-finstat  # 引用上游上传制品的 artifactName，与官方示例一致
          # 已删除错误参数 artifactRepository: release
          version: 0.2.2.0
          autoIncrement: true
          # 可选：补充 Release 元信息，让版本记录更清晰
          releaseTitle: "构建版本 ${CI_BUILD_NUMBER}"
          releaseNotes: |
            自动构建发布
            构建号：${CI_BUILD_NUMBER}
            提交哈希：${CI_COMMIT_SHA}
