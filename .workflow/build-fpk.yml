# Gitee Go 流水线：自动编译并发布 fn-finstat.fpk
# 触发条件：push 到 main、推送 v 开头的 Tag；也支持在 Gitee Go 界面手动运行
# 执行顺序：构建打包 FPK -> 上传制品库 -> 发布版本（阶段间经暂存制品 FPK_ARTIFACT 传递）
version: '1.0'
name: build-fpk
displayName: 构建发布 FPK
triggers:
  push:
    branches:
      include:
        - main
    tags:
      include:
        - ^v.*
stages:
  - name: build
    displayName: 1-构建打包FPK
    steps:
      - step: build@nodejs
        name: build_fpk
        displayName: 编译前端并打包 FPK
        # 基础镜像 Node 版本较旧，ci_build.sh 会自举 Node 20 再执行构建
        nodeVersion: 14.16.0
        commands: |
          bash scripts/ci_build.sh
        artifacts:
          # 暂存构建产物，供下游上传/发布阶段通过 dependArtifact 引用
          - name: FPK_ARTIFACT
            path:
              - ./fn-finstat.fpk
  - name: upload
    displayName: 2-上传制品库
    steps:
      - step: publish@general_artifacts
        name: publish_artifact
        displayName: 上传 FPK 到制品库
        dependArtifact: FPK_ARTIFACT
        artifactRepository: default
        artifactName: fn-finstat
  - name: release
    displayName: 3-发布版本
    steps:
      - step: publish@release_artifacts
        name: publish_release
        displayName: 发布 FPK 版本
        dependArtifact: fn-finstat
        artifactRepository: release
        # release 制品库要求四段版本号，末段随 autoIncrement 逐次构建自增
        version: 0.2.2.0
        autoIncrement: true
