# ============================================================
# fn-finstat GitHub Actions — 正式版打包 FPK + 发布 GitHub Release
#
# 与 build-fpk-dev.yml（测试版）是姊妹工作流，两者共用 scripts/ci_build.sh
# 与 .github/actions/fpk/ 下的五个复合动作，与 Gitee Go 的
# .workflow/build-fpk.yml 同源同语义，差别只在发布平台：
#   Gitee Go 用 release@gitee 插件，这里用 gh release（runner 自带 gh CLI）。
#
# 模块化布局（步骤细节都在动作里，本文件只保留管道编排与入口语义）：
#   .github/actions/fpk/setup-build-env   Python 3.12 + Node 24（pip/npm 缓存）
#   .github/actions/fpk/run-build         按渠道运行 ci_build.sh（镜像源覆盖）
#   .github/actions/fpk/verify-version    渠道校验；release 附加 tag 守卫 → version
#   .github/actions/fpk/upload-artifact   制品命名与清单
#   .github/actions/fpk/publish-release   gh release create/upload（--latest）
#
#   正式版（main）  1.1.2                    → tag v1.1.2
#
# 产物（Release 附件）：
#   fn-finstat-latest.fpk         渠道别名，稳定下载入口，链接可长期不变
#   fn-finstat-v1.1.2.fpk         带版本号副本，回答"这是哪一次构建"
#   MD5SUMS.txt                   两个交付产物的 MD5，可直接 md5sum -c 校验
#   releaseNode.txt               本次构建的分组提交日志 + SHA-256
# 裸名 fn-finstat.fpk 只进 workflow 制品（构建证据），不上传附件——
# 它与 latest 别名内容完全相同，一起挂 Release 只会让人犹豫该下哪个。
#
# 触发: push 到 main 分支；也支持在 Actions 界面手动运行（workflow_dispatch）
#
# 与 Gitee 的语义差异（此处更严格）：
#   tag v{版本} 已被占用且指向其他提交时直接失败，提示先递增 VERSION。
#   Gitee 的 allowUpdate: true 会静默把新构建挂到旧 tag 上——Release 页面
#   显示的版本号与附件实际内容错位，且 tag 仍指向旧提交，此类缺陷不红不响。
# ============================================================
name: build-fpk（正式版）

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 创建 Release 与 tag 需要 GITHUB_TOKEN 的 contents: write
permissions:
  contents: write

# 正式发布绝不并发取消（排队串行）；测试版工作流才允许 cancel-in-progress
concurrency:
  group: build-fpk-main
  cancel-in-progress: false

jobs:
  build:
    name: 构建打包 → 发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 完整历史与 tags：gen_release_notes.py 要推断"上次发版至今"的基线，
      # tag 守卫要比对已有 tag 指向的提交。
      # checkout 必须内联且在最前：仓库本地复合动作的文件本身就在仓库里，
      # 未检出无法引用（runner 工作区初始为空）
      - name: 检出仓库（完整历史 + tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建环境准备（Python 3.12 + Node 24）
        uses: ./.github/actions/fpk/setup-build-env

      - name: 构建打包（正式版渠道）
        uses: ./.github/actions/fpk/run-build
        with:
          channel: release
          build-number: ${{ github.run_number }}

      - name: 渠道校验 + tag 守卫
        id: verify
        uses: ./.github/actions/fpk/verify-version
        with:
          channel: release

      - name: 上传构建产物
        uses: ./.github/actions/fpk/upload-artifact
        with:
          channel: release
          version: ${{ steps.verify.outputs.version }}

      - name: 发布 GitHub Release（正式版）
        uses: ./.github/actions/fpk/publish-release
        with:
          channel: release
          version: ${{ steps.verify.outputs.version }}
          target-sha: ${{ github.sha }}
          gh-token: ${{ github.token }}
