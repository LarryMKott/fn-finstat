# ============================================================
# fn-finstat GitHub Actions — 测试版打包 FPK + 发布预发布 Release
#
# 与 build-fpk.yml（正式版）是姊妹工作流，两者共用 scripts/ci_build.sh，
# 与 Gitee Go 的 .workflow/build-fpk-dev.yml 同源同语义，唯一实质差别
# 是 BUILD_CHANNEL=dev：产物版本号追加 semver 预发布段。
#
#   测试版（dev）   1.1.0-dev.42.g1a2b3c4    → tag v1.1.0-dev.42.g1a2b3c4
#
# 测试版标识出现在四处，保证拿到包的人在任何环节都能识别：
#   1. 产物文件名      fn-finstat-dev.fpk（渠道别名，稳定入口）
#                      fn-finstat-v1.1.0-dev.42.g1a2b3c4.fpk（带版本号副本）
#   2. 包内 manifest   设备应用列表显示的版本号
#   3. app/config.py   应用「关于」页显示的版本号
#   4. Release         标题带（测试版）+ prerelease 标记 + 独立 tag
#
# 语义化版本的两点考虑（与 Gitee 版一致）:
#   - 预发布段（-dev.42.ghash）而非构建元数据（+ghash）：semver 规定预发布
#     版本小于同号正式版本，装了 1.1.0-dev.x 后能正常升级到正式 1.1.0；
#     且 `+` 在文件名与 URL 中需转义，会污染下载链接与 tag 名
#   - 同号测试版重复构建（构建号递增）会生成不同 tag，互不覆盖；
#     代价是 dev tag 会随提交堆积，如需收敛可改为固定 tag + 覆盖上传
#
# 触发: push 到 dev 分支、面向 main/dev 的 PR（只构建不发版）、手动运行
# ============================================================
name: build-fpk-dev（测试版）

on:
  push:
    branches:
      # 精确匹配 dev 分支；feature/dev-xxx 这类分支不会卷进来
      # （要出测试包可在 Actions 界面对该分支手动运行，走 PR 同样的制品路径）
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# push/手动运行时要创建预发布 Release（contents: write）；
# PR 触发时 GitHub 自动把 GITHUB_TOKEN 降为只读，且发布步骤已按事件名跳过
permissions:
  contents: write

# dev 分支高频 push：新提交到来时取消在途旧构建（发布在最后一步，中途取消不留残余）
concurrency:
  group: build-fpk-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建打包 → 预发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 完整历史：gen_release_notes.py 要推断"上次发版至今"的基线
      - name: 检出仓库（完整历史 + tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3.12 与设备端运行时同版本（manifest 的 install_dep_apps=python312）
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建打包（测试版渠道）
        env:
          # 显式指定渠道：测试版工作流永远出测试版，不依赖分支名推断
          # （PR 检出的是 merge commit，分支名推断在 PR 下本就不可靠）
          BUILD_CHANNEL: dev
          CI_BUILD_NUMBER: ${{ github.run_number }}
          # 覆盖脚本默认的国内镜像：GitHub 官方源在 runner 上更快
          PIP_INDEX_URL: https://pypi.org/simple
          NPM_REGISTRY: https://registry.npmjs.org
        run: bash scripts/ci_build.sh

      # 产物版本号由 ci_build.sh 派生后落盘（sync_version.py 是唯一算法来源）
      - name: 渠道校验
        run: |
          BUILD_VERSION="$(tr -d '\r\n' < .local_tmp/build-version.txt)"
          case "$BUILD_VERSION" in
            *-dev*)
              echo "✅ 测试版版本确认：${BUILD_VERSION}"
              ;;
            *)
              echo "❌ 渠道校验失败：测试版工作流产出的版本号缺少 -dev 标识（${BUILD_VERSION}）"
              exit 1
              ;;
          esac
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"

      # 裸名 fn-finstat.fpk 保留在制品里作构建证明（不进 Release 附件）
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fn-finstat-dev-v${{ env.BUILD_VERSION }}
          path: |
            fn-finstat.fpk
            fn-finstat-dev.fpk
            fn-finstat-v*.fpk
            MD5SUMS.txt
            releaseNode.txt
          if-no-files-found: error

      # PR 只构建不发版：PR 的产物从上面 workflow 制品里拿即可。
      # 构建号 + 短 sha 组合保证 tag 唯一，重复运行走覆盖上传（同构建重跑）
      - name: 发布预发布 Release（push / 手动运行）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${BUILD_VERSION}"
          FILES=(fn-finstat-dev.fpk "fn-finstat-v${BUILD_VERSION}.fpk" MD5SUMS.txt releaseNode.txt)
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || { echo "❌ 缺少产物 $f"; exit 1; }
          done
          # 描述同样取已入库的 RELEASE_NOTES.md：它经 ci_build.sh 门禁确认对应
          # 本次 VERSION；分组日志与 SHA-256 由附件 releaseNode.txt 承载
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "fn-finstat v${BUILD_VERSION}（测试版）" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
          echo "✅ 已发布预发布版：$(gh release view "$TAG" --json url -q .url)"
