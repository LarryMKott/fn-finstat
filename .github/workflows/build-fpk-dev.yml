# ============================================================
# fn-finstat GitHub Actions — 测试版打包 FPK + 发布预发布 Release
#
# 与 build-fpk.yml（正式版）是姊妹工作流，两者共用 scripts/ci_build.sh
# 与 .github/actions/fpk/ 下的五个复合动作，与 Gitee Go 的
# .workflow/build-fpk-dev.yml 同源同语义，唯一实质差别
# 是 BUILD_CHANNEL=dev：产物版本号追加 semver 预发布段。
#
# 模块化布局（步骤细节都在动作里，本文件只保留管道编排与入口语义）：
#   .github/actions/fpk/setup-build-env   Python 3.12 + Node 24（pip/npm 缓存）
#   .github/actions/fpk/run-build         按渠道运行 ci_build.sh（镜像源覆盖）
#   .github/actions/fpk/verify-version    渠道校验（dev：版本号必含 -dev）→ version
#   .github/actions/fpk/upload-artifact   制品命名与清单
#   .github/actions/fpk/publish-release   gh release create/upload（--prerelease）
#
#   测试版（dev）   1.1.2-dev.42.g1a2b3c4    → tag v1.1.2-dev.42.g1a2b3c4
#
# 测试版标识出现在四处，保证拿到包的人在任何环节都能识别：
#   1. 产物文件名      fn-finstat-dev.fpk（渠道别名，稳定入口）
#                      fn-finstat-v1.1.2-dev.42.g1a2b3c4.fpk（带版本号副本）
#   2. 包内 manifest   设备应用列表显示的版本号
#   3. app/config.py   应用「关于」页显示的版本号
#   4. Release         标题带（测试版）+ prerelease 标记 + 独立 tag
#
# 语义化版本的两点考虑（与 Gitee 版一致）:
#   - 预发布段（-dev.42.ghash）而非构建元数据（+ghash）：semver 规定预发布
#     版本小于同号正式版本，装了 1.1.2-dev.x 后能正常升级到正式 1.1.2；
#     且 `+` 在文件名与 URL 中需转义，会污染下载链接与 tag 名
#   - 同号测试版重复构建（构建号递增）会生成不同 tag，互不覆盖；
#     代价是 dev tag 会随提交堆积，如需收敛可改为固定 tag + 覆盖上传
#
# 触发: push 到 dev 分支、面向 main/dev 的 PR（只构建不发版）、手动运行
# ============================================================
name: build-fpk-dev（测试版）

on:
  push:
    branches:
      # 精确匹配 dev 分支；feature/dev-xxx 这类分支不会卷进来
      # （要出测试包可在 Actions 界面对该分支手动运行，走 PR 同样的制品路径）
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# push/手动运行时要创建预发布 Release（contents: write）；
# PR 触发时 GitHub 自动把 GITHUB_TOKEN 降为只读，且发布步骤已按事件名跳过
permissions:
  contents: write

# dev 分支高频 push：新提交到来时取消在途旧构建（发布在最后一步，中途取消不留残余）
concurrency:
  group: build-fpk-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建打包 → 预发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 完整历史：gen_release_notes.py 要推断"上次发版至今"的基线。
      # checkout 必须内联且在最前：仓库本地复合动作的文件本身就在仓库里，
      # 未检出无法引用（runner 工作区初始为空）
      - name: 检出仓库（完整历史 + tags）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建环境准备（Python 3.12 + Node 24）
        uses: ./.github/actions/fpk/setup-build-env

      - name: 构建打包（测试版渠道）
        uses: ./.github/actions/fpk/run-build
        with:
          channel: dev
          build-number: ${{ github.run_number }}

      - name: 渠道校验
        id: verify
        uses: ./.github/actions/fpk/verify-version
        with:
          channel: dev

      - name: 上传构建产物
        uses: ./.github/actions/fpk/upload-artifact
        with:
          channel: dev
          version: ${{ steps.verify.outputs.version }}

      # PR 只构建不发版：PR 的产物从上面 workflow 制品里拿即可。
      # 构建号 + 短 sha 组合保证 tag 唯一，重复运行走覆盖上传（同构建重跑）
      - name: 发布预发布 Release（push / 手动运行）
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/fpk/publish-release
        with:
          channel: dev
          version: ${{ steps.verify.outputs.version }}
          target-sha: ${{ github.sha }}
          gh-token: ${{ github.token }}
